<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room View</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1015;
    --panel: rgba(22, 25, 32, 0.82);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8d8c85;
    --person-1: #3987e5;
    --person-2: #d95926;
    --person-3: #199e70;
    --heat: #9085e9;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --bar-track: rgba(255, 255, 255, 0.10);
    --bar-fill: #e9ecf2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text-primary);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--panel-border);
           border-radius: 12px; padding: 14px 16px; backdrop-filter: blur(8px); z-index: 2; }
  #status { top: 16px; left: 16px; width: 290px; }
  #links  { top: 16px; right: 16px; width: 270px; }
  #controls { bottom: 16px; left: 16px; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; max-width: calc(100vw - 32px); }
  #simbox { bottom: 16px; right: 16px; width: 270px; display: none; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .01em; }
  .sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .count { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 4px; }
  .count b { font-size: 44px; line-height: 1; font-weight: 650; font-variant-numeric: tabular-nums; }
  .count span { color: var(--text-secondary); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
          font-size: 12px; background: rgba(255,255,255,0.07); color: var(--text-secondary); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .chip.good .dot { background: var(--good); }
  .chip.warn .dot { background: var(--warning); }
  .chip.bad .dot { background: var(--critical); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .label { color: var(--text-secondary); font-size: 12px; }
  .bar { height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--bar-fill); border-radius: 3px;
             transition: width .25s; }
  .people-list { margin-top: 10px; display: grid; gap: 4px; }
  .person-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .person-row .meta { color: var(--text-muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  button, a.btn { font: inherit; font-size: 12px; color: var(--text-primary); background: rgba(255,255,255,0.08);
                  border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 10px; cursor: pointer;
                  text-decoration: none; }
  button:hover, a.btn:hover { background: rgba(255,255,255,0.14); }
  button.on { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.3); }
  button.primary { background: #2a78d6; border-color: #2a78d6; }
  #links h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  .link-row { display: grid; grid-template-columns: 64px 1fr 44px; align-items: center; gap: 8px;
              font-size: 12px; margin: 5px 0; }
  .link-row .name { color: var(--text-secondary); }
  .link-row .val { text-align: right; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .link-row.offline .name::after { content: " \26A0"; color: var(--warning); }
  .legend { margin-top: 10px; display: grid; gap: 4px; font-size: 11px; color: var(--text-muted); }
  .legend .grad { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #4b5566, #f2f4f8); }
  .legend .heat { height: 6px; border-radius: 3px; background: linear-gradient(90deg, rgba(144,133,233,0), var(--heat)); }
  #banner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3;
            background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
            padding: 18px 22px; max-width: min(460px, calc(100vw - 32px)); text-align: center; display: none; }
  #banner b { display: block; font-size: 16px; margin-bottom: 6px; }
  #banner p { margin: 0 0 12px; color: var(--text-secondary); }
  .tag { font: 600 12px system-ui, sans-serif; color: var(--text-primary); background: rgba(14,16,21,0.72);
         padding: 2px 7px; border-radius: 6px; white-space: nowrap; pointer-events: none;
         border-left: 3px solid var(--c, #aaa); }
  .tag small { font-weight: 400; color: var(--text-secondary); }
  .node-tag { font: 500 11px system-ui, sans-serif; color: var(--text-secondary); pointer-events: none;
              background: rgba(14,16,21,0.55); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
  .zone-tag { font: 600 13px system-ui, sans-serif; color: rgba(255,255,255,0.22); pointer-events: none; }
  .ghost-tag { font: 500 10px system-ui, sans-serif; color: rgba(255,255,255,0.55); pointer-events: none; }
  .hide-labels .tag, .hide-labels .node-tag, .hide-labels .zone-tag, .hide-labels .ghost-tag { display: none; }
  .note { color: var(--text-muted); font-size: 11px; margin-top: 10px; }
  @media (max-width: 760px) {
    #status { width: auto; right: 16px; padding: 10px 12px; }
    .count b { font-size: 32px; }
    #links { display: none; }
    #simbox { display: none !important; }
  }
</style>
<script type="importmap">
  { "imports": {
      "three": "/static/vendor/three/three.module.js",
      "three/addons/": "/static/vendor/three/"
  } }
</script>
</head>
<body>
  <div id="scene"></div>

  <div id="status" class="panel">
    <h1 id="room-name">Room</h1>
    <div class="sub">Live WiFi sensing &middot; positions are estimates</div>
    <div class="count"><b id="count">&ndash;</b><span id="count-word">people</span></div>
    <div class="chips">
      <span class="chip" id="chip-mode"><span class="dot"></span><span>&ndash;</span></span>
      <span class="chip" id="chip-cal"><span class="dot"></span><span>&ndash;</span></span>
      <span class="chip" id="chip-data"><span class="dot"></span><span>&ndash;</span></span>
      <span class="chip" id="chip-air"><span class="dot"></span><span>&ndash;</span></span>
    </div>
    <div class="row" style="margin-top:6px"><span class="label">Room activity</span>
      <div class="bar" style="max-width:150px"><i id="activity"></i></div></div>
    <div class="people-list" id="people"></div>
    <div class="row" style="margin-top:12px; gap:6px; justify-content:flex-start">
      <button id="btn-cal">Calibrate empty room</button>
    </div>
  </div>

  <div id="links" class="panel">
    <h2>Radio paths</h2>
    <div id="link-rows"></div>
    <div class="legend">
      <div class="row"><span>Path disturbed</span><span>none &rarr; strong</span></div>
      <div class="grad"></div>
      <div class="row" style="margin-top:4px"><span>Floor glow</span><span>where someone likely is</span></div>
      <div class="heat"></div>
    </div>
    <div class="note" id="model-note"></div>
  </div>

  <div id="simbox" class="panel">
    <h2 style="font-size:13px;margin:0 0 6px">Simulator check</h2>
    <div class="label" id="sim-text"></div>
    <div class="note">White outlines = where the simulated people really are.</div>
  </div>

  <div id="controls" class="panel">
    <button id="t-spin" class="on">Spin</button>
    <button id="t-heat" class="on">Floor glow</button>
    <button id="t-links" class="on">Paths</button>
    <button id="t-labels" class="on">Labels</button>
    <button id="t-ghost" class="on" style="display:none">True positions</button>
    <a class="btn" href="/">Link dashboard</a>
    <a class="btn" href="/collect">Volunteers</a>
  </div>

  <div id="banner"><b id="banner-title"></b><p id="banner-text"></p><div id="banner-action"></div></div>

  <script type="module" src="/static/room.js"></script>
</body>
</html>
